# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Les URL générées par asset() contiennent la date de modification du fichier
    # (ex. /css/app.css?v=1762520400) pour éviter les problèmes de cache navigateur.
    assets:
        version_strategy: App\Asset\FileModificationTimeVersionStrategy

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
